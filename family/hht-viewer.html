// Build lookup maps
const personById = Object.fromEntries(RAW.people.map(p => [p.id, p]));
const famById    = Object.fromEntries(RAW.families.map(f => [f.id, f]));

// Find root (first person — John Hanna)
const ROOT_ID = RAW.people[0].id;

let currentRoot = ROOT_ID;
let currentView = "descendancy";

// ---------------------------------------------------------------------------
// Tree data builders
// ---------------------------------------------------------------------------

function descTree(personId, maxDepth = 30, depth = 0) {
  const p = personById[personId];
  if (!p) return null;
  const node = { id: p.id, name: p.name, birt: p.birt, deat: p.deat, children: [] };
  if (depth >= maxDepth) return node;
  for (const famId of (p.fams || [])) {
    const fam = famById[famId];
    if (!fam || fam.husb !== p.id) continue; // only process families where this person is HUSB
    for (const childId of (fam.children || [])) {
      const child = descTree(childId, maxDepth, depth + 1);
      if (child) node.children.push(child);
    }
  }
  return node;
}

function ancestorTree(personId, maxGen = 8, gen = 0) {
  const p = personById[personId];
  if (!p || gen >= maxGen) return null;
  const node = { id: p.id, name: p.name, birt: p.birt, deat: p.deat, children: [] };
  if (p.famc) {
    const fam = famById[p.famc];
    if (fam) {
      if (fam.husb) { const c = ancestorTree(fam.husb, maxGen, gen+1); if (c) node.children.push(c); }
      if (fam.wife) { const c = ancestorTree(fam.wife, maxGen, gen+1); if (c) node.children.push(c); }
    }
  }
  return node;
}

// ---------------------------------------------------------------------------
// Chart rendering helpers
// ---------------------------------------------------------------------------

const svg   = d3.select("#svg");
let   gMain = null;

function initSvg() {
  svg.selectAll("*").remove();
  const zoom = d3.zoom().scaleExtent([0.05, 4]).on("zoom", e => gMain.attr("transform", e.transform));
  svg.call(zoom);
  gMain = svg.append("g");
  return gMain;
}

function nodeLabel(d) {
  const name = d.data.name || "";
  return name.length > 28 ? name.slice(0, 26) + "…" : name;
}

function nodeDates(d) {
  const { birt, deat } = d.data;
  if (birt && deat) return `${birt}–${deat}`;
  if (birt)         return `b. ${birt}`;
  return "";
}

const NODE_W = 140, NODE_H = 38, NODE_RY = 5;

function drawNodes(g, nodes, links, isHoriz) {
  g.selectAll(".link").data(links).enter().append("path")
    .attr("class", "link")
    .attr("d", isHoriz
      ? d3.linkHorizontal().x(d => d.y).y(d => d.x)
      : d3.linkVertical().x(d => d.x).y(d => d.y));

  const node = g.selectAll(".node").data(nodes).enter().append("g")
    .attr("class", "node")
    .attr("transform", d => isHoriz ? `translate(${d.y},${d.x})` : `translate(${d.x},${d.y})`);

  node.append("rect")
    .attr("x", -NODE_W/2).attr("y", -NODE_H/2)
    .attr("width", NODE_W).attr("height", NODE_H)
    .attr("rx", NODE_RY).attr("ry", NODE_RY)
    .on("click", (e, d) => {
      currentRoot = d.data.id;
      renderCurrent();
      showInfo(d.data.id);
    });

  node.append("text")
    .attr("dy", dates => nodeDates(dates) ? "-4" : "4")
    .attr("text-anchor", "middle")
    .text(nodeLabel);

  node.filter(d => nodeDates(d))
    .append("text")
    .attr("class", "dates")
    .attr("dy", "10")
    .attr("text-anchor", "middle")
    .text(nodeDates);
}

// ---------------------------------------------------------------------------
// View renderers
// ---------------------------------------------------------------------------

function renderDescendancy(vertical) {
  const data = descTree(currentRoot, 20);
  if (!data) return;
  const root = d3.hierarchy(data);
  const [W, H] = [svg.node().clientWidth || 1200, svg.node().clientHeight || 800];

  let layout;
  if (vertical) {
    layout = d3.tree().nodeSize([NODE_W + 12, NODE_H + 24]);
  } else {
    layout = d3.tree().nodeSize([NODE_H + 16, NODE_W + 40]);
  }
  layout(root);

  const g = initSvg();
  const nodes = root.descendants();
  const links = root.links();
  drawNodes(g, nodes, links, !vertical);

  // Center
  const xs = nodes.map(d => vertical ? d.x : d.y);
  const ys = nodes.map(d => vertical ? d.y : d.x);
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2;
  const cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  g.attr("transform", `translate(${W/2 - cx},${H/2 - cy})`);
}

function renderFan() {
  const data = ancestorTree(currentRoot, 9);
  if (!data) return;
  const root = d3.hierarchy(data);
  const [W, H] = [svg.node().clientWidth || 1200, svg.node().clientHeight || 800];
  const R = Math.min(W, H) * 0.44;

  const layout = d3.tree().size([2 * Math.PI, R]);
  layout(root);

  const g = initSvg();
  g.attr("transform", `translate(${W/2},${H/2})`);

  // Links
  g.selectAll(".link").data(root.links()).enter().append("path")
    .attr("class", "link")
    .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y));

  // Nodes
  const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
    .attr("class", "node")
    .attr("transform", d => {
      const angle = d.x - Math.PI / 2;
      return `translate(${d.y * Math.cos(angle)},${d.y * Math.sin(angle)})`;
    });

  node.append("rect")
    .attr("x", -NODE_W/2).attr("y", -NODE_H/2)
    .attr("width", NODE_W).attr("height", NODE_H)
    .attr("rx", NODE_RY).attr("ry", NODE_RY)
    .on("click", (e, d) => { currentRoot = d.data.id; renderCurrent(); showInfo(d.data.id); });

  node.append("text")
    .attr("dy", d => nodeDates(d) ? "-4" : "4")
    .attr("text-anchor", "middle")
    .attr("transform", d => {
      const angle = (d.x * 180 / Math.PI - 90);
      const flip = (angle > 90 && angle < 270) ? 180 : 0;
      return `rotate(${flip})`;
    })
    .text(nodeLabel);

  node.filter(d => nodeDates(d))
    .append("text").attr("class","dates").attr("dy","10").attr("text-anchor","middle")
    .text(nodeDates);
}

function renderCurrent() {
  if (currentView === "fan") renderFan();
  else if (currentView === "landscape") renderDescendancy(false);
  else renderDescendancy(true); // descendancy or portrait
}

// ---------------------------------------------------------------------------
// Info panel
// ---------------------------------------------------------------------------

function showInfo(personId) {
  const p = personById[personId];
  if (!p) return;
  const panel = document.getElementById("info-panel");
  document.getElementById("ip-name").textContent = p.name;
  const dates = p.birt && p.deat ? `${p.birt} – ${p.deat}` : p.birt ? `b. ${p.birt}` : "";
  document.getElementById("ip-dates").textContent = dates;

  // Build detail: spouses + children count
  let details = [];
  for (const famId of (p.fams || [])) {
    const fam = famById[famId];
    if (!fam) continue;
    const spouseId = fam.husb === p.id ? fam.wife : fam.husb;
    const spouse = spouseId ? personById[spouseId] : null;
    const kids = (fam.children || []).length;
    if (spouse) details.push(`Spouse: ${spouse.name}${kids ? ` (${kids} children)` : ""}`);
    else if (kids) details.push(`${kids} children`);
  }
  document.getElementById("ip-detail").innerHTML = details.join("<br>");
  panel.style.display = "block";
}

// ---------------------------------------------------------------------------
// Search / autocomplete
// ---------------------------------------------------------------------------

const searchEl = document.getElementById("search");
const acEl     = document.getElementById("autocomplete");

searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  acEl.innerHTML = "";
  if (q.length < 2) return;
  const matches = RAW.people.filter(p => p.name.toLowerCase().includes(q)).slice(0, 12);
  matches.forEach(p => {
    const div = document.createElement("div");
    div.className = "ac-item";
    div.textContent = p.name + (p.birt ? ` (b. ${p.birt})` : "");
    div.addEventListener("click", () => {
      currentRoot = p.id;
      searchEl.value = p.name;
      acEl.innerHTML = "";
      renderCurrent();
      showInfo(p.id);
    });
    acEl.appendChild(div);
  });
});

document.addEventListener("click", e => {
  if (!e.target.closest("#search-wrap")) acEl.innerHTML = "";
});

// ---------------------------------------------------------------------------
// View buttons
// ---------------------------------------------------------------------------

document.querySelectorAll(".view-btn[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".view-btn[data-view]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    renderCurrent();
  });
});

document.getElementById("first-ancestor-btn").addEventListener("click", () => {
  currentRoot = ROOT_ID;
  renderCurrent();
  showInfo(ROOT_ID);
});

// ---------------------------------------------------------------------------
// Stats
// ---------------------------------------------------------------------------

document.getElementById("stats").textContent =
  `${RAW.people.length} people · ${RAW.families.length} families`;

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

renderCurrent();
showInfo(ROOT_ID);
</script>
